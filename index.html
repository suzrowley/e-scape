<!doctype html>
<html lang="en-AU"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparky">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="index.webmanifest">
<title>The Great E-scape</title>


<meta name="theme-color" content="#173A40">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap">
</head><body>
<style>
/* Layout: one-handed phone guide. River header with progress spine, date tabs, stacked cards, bottom nav with Trip and Days */
:root{
  --deep:#173A40; --on-deep:#FFFFFF; --sea:#2F6F73; --on-sea:#FFFFFF; --sun:#D2A23A; --on-sun:#15262A;
  --bg:#EEF2EF; --card:#FFFFFF; --ink:#15262A; --muted:#4D6064; --line:#D3DDDA; --alert-bg:#FAF0D9; --done:#8A9A9C; --flag-bg:#E6EEEC;
  --display:"Fraunces",Georgia,serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D2428; --sea:#6DB5B5; --on-sea:#0B1A1C; --sun:#E2B655; --on-sun:#15100A;
  --bg:#0E1A1C; --card:#172A2D; --ink:#E5EEEC; --muted:#9DB1B1; --line:#29403F; --alert-bg:#33291A; --done:#6E8384; --flag-bg:#1D3134; color-scheme:dark}}
:root[data-theme="dark"]{
  --deep:#0D2428; --sea:#6DB5B5; --on-sea:#0B1A1C; --sun:#E2B655; --on-sun:#15100A;
  --bg:#0E1A1C; --card:#172A2D; --ink:#E5EEEC; --muted:#9DB1B1; --line:#29403F; --alert-bg:#33291A; --done:#6E8384; --flag-bg:#1D3134; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:650;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font-family:var(--body)}

header.top{background:var(--deep);color:var(--on-deep);padding-block:22px 18px;display:grid;gap:4px}
.top h1{font-size:30px}
.top .sub{opacity:.85;font-size:15px}

/* Progress spine */
.spine{margin-top:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 10px 10px;display:grid;gap:8px}
.spine-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.spine-top b{color:var(--sun);letter-spacing:0;font-size:15px;font-variant-numeric:tabular-nums}
.nodes{position:relative;display:flex;justify-content:space-between}
.track,.fill{position:absolute;left:14px;top:24px;height:4px;border-radius:2px}
.track{right:14px;background:rgba(255,255,255,.2)}
.fill{background:var(--sun);width:0;transition:width .4s}
.node{position:relative;z-index:1;display:grid;justify-items:center;gap:4px;background:none;border:0;color:var(--on-deep);font:12px/1.1 var(--body);padding:0;cursor:pointer;width:42px;font-variant-numeric:tabular-nums}
.node .km{opacity:.8}
.node i{width:16px;height:16px;border-radius:50%;background:var(--deep);border:2.5px solid rgba(255,255,255,.55)}
.node.done i{background:var(--sun);border-color:var(--sun)}
.node.next i{background:var(--on-deep);border-color:var(--sun)}
@media (prefers-reduced-motion:no-preference){.node.next i{animation:pulse 2s infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(210,162,58,.6)}50%{box-shadow:0 0 0 6px rgba(210,162,58,0)}}
.node:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deep);display:flex;gap:6px;overflow-x:auto;padding-block:10px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 52px;position:relative;font:700 13px/1.15 var(--body);border:0;border-radius:10px;padding:8px 4px;background:rgba(255,255,255,.12);color:var(--on-deep);cursor:pointer;text-align:center}
.tab b{display:block;font-size:19px;font-family:var(--display)}
.tab.ride{box-shadow:inset 0 -3px 0 var(--sun)}
.tab[aria-selected="true"]{background:var(--sun);color:var(--on-sun);box-shadow:none}
.tab .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--sun)}
.tab[aria-selected="true"] .dot{background:var(--on-sun)}

main{display:grid;gap:14px;padding-block:16px}
.card{background:var(--card);border-radius:14px;padding:16px;display:grid;gap:12px}
.meta{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card h2{font-size:25px}
.card h3{font-size:19px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:9px 10px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:20px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.t b{font-family:var(--body);font-size:16px;line-height:1.3}
.terrain{font-size:16px;color:var(--muted)}
.alert{border-left:5px solid var(--sun);background:var(--alert-bg);border-radius:0 10px 10px 0;padding:10px 12px;display:grid;gap:2px}
.alert b{font-size:16px}
.alert span{font-size:15px}
.flag{background:var(--flag-bg);border-radius:10px;padding:10px 12px;font-size:15px}
.flag b{display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:10px;border-radius:12px;background:var(--sea);color:var(--on-sea);font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;line-height:1.25}
.btn.alt{background:transparent;color:var(--sea);box-shadow:inset 0 0 0 2px var(--sea)}
.btn.wide{grid-column:1/-1}
.btn:focus-visible,.tab:focus-visible,.nav button:focus-visible,.link:focus-visible,.stop:focus-visible,.ms:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
ul.hl{margin:0;padding-left:20px;display:grid;gap:6px}
.notes{color:var(--muted);font-size:15px}
.link{font:inherit;font-size:15px;background:none;border:0;color:var(--sea);font-weight:700;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.row-end{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Day timeline */
.flow{display:grid;gap:12px}
.welcome{border:2px solid var(--sun)}
.welcome-in h3{margin:16px 0 4px;font-size:17px}
.welcome-in p{margin:6px 0}
.welcome-in .hello{margin:24px 0 22px!important}
.welcome-in .sparky{margin-top:0}
.welcome-in .how{margin-top:24px!important}
.sign{font:600 17px var(--display);margin-top:10px!important}
.welcome-later{margin-top:16px!important;padding-top:10px;border-top:1px solid var(--line)}
.welcome-end{font-weight:700;margin-top:14px!important}
details.pack.ex{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
details.pack.ex>summary h3{font-size:17px;margin:0}
.ms-demo{display:grid;gap:8px;margin:10px 0;pointer-events:none}
.ms{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px dashed var(--sea);border-radius:14px;padding:12px 14px;color:inherit;font:inherit;cursor:pointer}
.ms i{width:24px;height:24px;border-radius:50%;border:3px solid var(--sea);flex:0 0 auto;display:grid;place-items:center}
.ms.on{border-style:solid;background:color-mix(in srgb,var(--sea) 10%,var(--card))}
.ms.on i{background:var(--sea)}
.ms.on i::after{content:"";width:6px;height:11px;border:solid var(--on-sea);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ms b{display:block;font-size:17px}
.ms small{display:block;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sec{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-head .meta{flex:1}
.sec-tools{display:flex;gap:4px;align-items:center}
.sec-tools .link{font-size:14px}
.chev{font:700 18px var(--body);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;transition:transform .2s}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .stops{display:none}
.stops{display:grid}
.stop-row{display:flex;gap:8px;align-items:stretch}
.stop{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px 2px;cursor:pointer;border-radius:8px}
.stop .c{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--sea);flex:0 0 auto;margin-top:2px;display:grid;place-items:center}
.stop.on .c{background:var(--sea)}
.stop.on .c::after{content:"";width:6px;height:11px;border:solid var(--on-sea);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stop.on .nm{text-decoration:line-through;color:var(--done)}
.stop.on .ds{opacity:.6}
.stop .nm{font-weight:700;font-size:17px}
.stop .ds{display:block;font-size:15px;color:var(--muted);line-height:1.4}
.stop .lc{display:block;font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.book{background:var(--sun);color:var(--on-sun)}
.hide-btn{flex:0 0 auto;align-self:center;font:700 14px var(--body);border:2px solid var(--line);color:var(--ink);background:none;border-radius:999px;padding:6px 12px;cursor:pointer}
.hide-btn.restore{border-color:var(--sea);color:var(--sea)}
.stop-row.hid .stop{opacity:.45}
.prompt{background:var(--alert-bg);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:15px}
.prompt .btns .btn{min-height:42px;font-size:15px}
.phone{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0 8px 36px}
.phone span{font-size:15px;font-variant-numeric:tabular-nums}
.copy{font:700 14px var(--body);border:2px solid var(--sea);color:var(--sea);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;flex:0 0 auto}

/* Packing */
details.pack>summary,details.sub>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.pack>summary::-webkit-details-marker,details.sub>summary::-webkit-details-marker{display:none}
details.pack>summary h3{font-size:21px}
.steps{margin:8px 0 14px;padding-left:22px;display:grid;gap:6px}
details.pack>summary::after,details.sub>summary::after{content:"⌄";font:700 18px var(--body);color:var(--muted);transition:transform .2s;transform:rotate(-90deg)}
details[open].pack>summary::after,details[open].sub>summary::after{transform:none}
details.head>summary{align-items:flex-start}
.head-sum{display:grid;gap:4px;min-width:0}
.head-sum h2{font-size:25px}
details.head[open] .when-closed{display:none}
.look{display:grid;gap:6px;padding-top:4px}
.pack-body{display:grid;gap:10px;margin-top:12px}
details.sub{background:var(--bg);border-radius:12px;padding:10px 12px}
details.sub>summary b{font-size:17px}
details.sub>summary .meta{margin-left:auto}
.check{display:grid;gap:2px;margin-top:6px}
.check label{display:flex;gap:12px;align-items:center;padding:8px 2px;border-radius:8px;cursor:pointer;min-height:44px}
.check input{appearance:none;width:26px;height:26px;border:2.5px solid var(--sea);border-radius:7px;flex:0 0 auto;display:grid;place-items:center;margin:0;cursor:pointer;background:var(--card)}
.check input:checked{background:var(--sea)}
.check input:checked::after{content:"";width:7px;height:13px;border:solid var(--on-sea);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{text-decoration:line-through;color:var(--done)}
.check input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.edit-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line);min-height:46px}
.edit-row span{min-width:0;overflow-wrap:anywhere}
.edit-row input,.rename input{flex:1;min-width:0;font:inherit;font-size:max(16px,1em);padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.edit-row input:focus,.rename input:focus{outline:none;border-color:var(--sea)}
.rename{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
.rename label{font-weight:700;font-size:14px;color:var(--muted,inherit)}
.newsec{margin-top:4px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.add input:focus{outline:none;border-color:var(--sea)}
.add .btn{flex:0 0 auto;min-height:46px;padding:8px 16px}
textarea{width:100%;min-height:110px;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--sea)}
.saved{font-size:13px;color:var(--sea);font-weight:700;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* Trip view */
.days{display:grid}
.day-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.day-row:last-child{border-bottom:0}
.day-row small{display:block;color:var(--muted);font-size:14px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.today{background:var(--sun);color:var(--on-sun)}
.pill.done{color:var(--done)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big-num{font-family:var(--display);font-size:44px;line-height:1}
.surprise{background:var(--sun);color:var(--on-sun)}
.surprise .meta{color:inherit;opacity:.8}
.complete{background:var(--sea);color:var(--on-sea)}
.complete .meta{color:inherit;opacity:.85}
.water{background:var(--flag-bg);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.water b{font-size:16px}
.water span{font-size:15px}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact>div{min-width:0;display:grid;gap:1px}
.contact small{color:var(--muted);font-size:14px}
.contact .num{font-size:16px;font-variant-numeric:tabular-nums}
.bk{font-size:14px;font-weight:700;color:var(--muted)}
.bk.yes{color:var(--sea)}
.draft{font-size:13px;color:var(--muted);text-align:center;padding-block:4px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
.nav button{font:700 15px var(--body);background:none;border:0;color:var(--muted);padding:14px 4px 16px;cursor:pointer;border-top:3px solid transparent}
.nav button[aria-current="page"]{color:var(--sea);border-top-color:var(--sea)}
/* Test copy and secret extras */
.testbar{background:repeating-linear-gradient(135deg,var(--card),var(--card) 12px,var(--alert-bg) 12px,var(--alert-bg) 24px);border:2px dashed var(--sea)}
.wpop{position:fixed;inset:0;z-index:50;background:rgba(10,20,22,.6);display:grid;place-items:center;padding:20px}
.wpop .pc{background:var(--card);color:var(--ink);border-radius:18px;padding:22px 18px 18px;display:grid;gap:14px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.wpop .q,.wq .q{font-family:var(--display);font-style:italic;font-weight:500}
.wpop .q{font-size:21px;line-height:1.35;margin:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.wq{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.rules{margin:0;padding-left:22px;display:grid;gap:8px;text-align:left;font-size:17px;line-height:1.4}
.wpop .rules{font-size:17px}
.wpop h2{font-size:23px;margin:0}
.wq .q{font-size:17px;line-height:1.4}
.finished{display:grid;gap:2px;justify-items:center;background:var(--sun);color:var(--on-sun);border:0;border-radius:14px;padding:14px;font:700 20px var(--body);cursor:pointer;width:100%}
.surprise.center{text-align:center;background:var(--deep);color:#FFFFFF;border:2px solid var(--sun)}
.surprise.center p{white-space:pre-line}
.envelope{display:grid;justify-items:center;gap:8px;text-align:center;padding:26px 16px;border-radius:16px;border:0;background:var(--sun);color:var(--on-sun);cursor:pointer;font:inherit;width:100%;margin:0 0 14px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.envelope .seal{width:64px;height:64px;border-radius:50%;background:var(--on-sun);color:var(--sun);display:grid;place-items:center;font:650 30px var(--display)}
.envelope b{font:650 24px/1.2 var(--display)}
.envelope>span:last-child{font-size:15px;opacity:.85}
.bov{position:fixed;inset:0;z-index:55;background:rgba(8,20,22,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) 16px 32px}
.bov[hidden],.vv[hidden]{display:none}
.bc{width:100%;max-width:420px;background:var(--card);color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);transform-origin:50% 0;animation:bcopen .7s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes bcopen{from{transform:perspective(900px) rotateX(-80deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bc{animation:none}}
.bc-top{background:var(--deep);color:var(--on-deep);text-align:center;padding:34px 20px 28px}
.bc-top h2{font:650 44px/1.05 var(--display);margin:0;color:inherit}
.bc-bar{width:56px;height:4px;background:var(--sun);border-radius:2px;margin:16px auto 0}
.bc-body{padding:22px 20px 24px}
#bc-close{width:100%}
.bc-msg{font-size:19px;margin:0;text-align:center;white-space:pre-line}
.bc-notes{display:grid;gap:12px;margin:20px 0 22px;padding:0;list-style:none}
.bnote{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--alert-bg);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.bnote{--kb:var(--alert-bg);--kc:var(--sea);background:var(--kb);border-color:transparent}
.k-felix{--kb:#DCE5F0;--kc:#3A6EA5}.k-hugo{--kb:#DCE8DC;--kc:#3C7650}.k-kai{--kb:#F6ECC9;--kc:#8F6A0C}.k-liya{--kb:#F3DCDD;--kc:#B4475A}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .k-felix{--kb:#2F3F52;--kc:#8DB4E2}:root:not([data-theme=light]) .k-hugo{--kb:#344A3C;--kc:#8FC9A0}:root:not([data-theme=light]) .k-kai{--kb:#4A4128;--kc:#E4C568}:root:not([data-theme=light]) .k-liya{--kb:#4A3439;--kc:#E89AA7}}
.kem{flex:none;font-size:30px;line-height:1}
.bc-notes li:nth-child(odd) .bnote{transform:rotate(-1deg)}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-");
const dateOf = d => new Date(d.date+"T00:00:00");
const fmt = (d,o) => dateOf(d).toLocaleDateString("en-AU",o);
const shortDate = d => fmt(d,{weekday:"short",day:"numeric",month:"short"});
const todayISO = (()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")})();
const todayIdx = DAYS.findIndex(d=>d.date===todayISO);
const before = todayISO < DAYS[0].date, after = todayISO > DAYS[DAYS.length-1].date;
const focusIdx = todayIdx>=0 ? todayIdx : (after ? DAYS.length-1 : (before ? 0 : Math.max(0,DAYS.findIndex(d=>d.date>todayISO))));

// Milestones get a global number in trip order
const MS = [];
DAYS.forEach(d=>d.flow.forEach(f=>{ if(f.ms){ f.idx=MS.length; MS.push({...f,day:d.id}) } }));
const RIDE_DAYS = DAYS.filter(d=>d.kind==="ride");

/* State: one object on this phone */
const KEY = "escape_v1";
try{ ["m2m_v1","m2m_v2","m2m_v3","m2m_v4"].forEach(k=>localStorage.removeItem(k)) }catch(e){}
let S = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ return {} } })();
const save = () => { try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} };
const sget = (k,def) => (k in S ? S[k] : def);
const sset = (k,v) => { if(v===undefined||v===false||v===null) delete S[k]; else S[k]=v; save() };

let ui = { view: sget("view","trip")==="day"?"day":"trip", day: focusIdx, editSec:null, prompt:null, listEdit:null, resetAsk:false };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2000) }

/* Progress: furthest ticked milestone, nudged by ticked stops further along */
function progress(){
  let km=0, done=0;
  MS.forEach(m=>{ if(S["ms_"+m.idx]){ done++; km=Math.max(km,m.km) } });
  if(done) DAYS.forEach(d=>d.flow.forEach(f=>f.sec&&f.stops.forEach(s=>{ if(s.at!=null && S[stopId(d,f,s)]) km=Math.max(km,s.at) })));
  return {km, done, pct:Math.round(km/TOTAL_KM*100)};
}
const stopId = (d,f,s) => "s_"+d.id+"_"+slug(f.sec)+"_"+slug(s.n);
const secId = (d,f) => "sec_"+d.id+"_"+slug(f.sec);
// Stops they add themselves, per section, on this phone only
const allStops = (d,f) => f.stops.concat((S["own_"+secId(d,f)]||[]).map(n=>({n,own:true})));
function rideDone(d){ const ms=MS.filter(m=>m.day===d.id); return ms.length && ms.every(m=>S["ms_"+m.idx]) }

function renderSpine(){
  const p=progress();
  const nextIdx = p.done ? SPINE.findIndex(n=>n.km>p.km) : -1;
  $("#spine").innerHTML = `<div class="spine-top"><span>Trail progress</span><b>${p.pct}% · ${p.km} km</b></div>
    <div class="nodes"><span class="track"></span><span class="fill" id="fill"></span>
    ${SPINE.map((n,i)=>`<button class="node ${p.done&&n.km<=p.km?"done":""} ${i===nextIdx?"next":""}" data-day="${n.day}" aria-label="${esc(n.label)}, ${n.km} km"><span class="km">${n.km}</span><i></i><span>${esc(n.label)}</span></button>`).join("")}</div>`;
  // Fill runs between dot centres, spaced evenly, interpolated by km
  let pos=0;
  if(p.done){ for(let i=0;i<SPINE.length-1;i++){ const a=SPINE[i].km,b=SPINE[i+1].km; if(p.km>=b) pos=i+1; else if(p.km>a){ pos=i+(p.km-a)/(b-a); break } else break } }
  $("#fill").style.width = `calc((100% - 28px) * ${pos/(SPINE.length-1)})`;
  $("#spine").querySelectorAll(".node").forEach(b=>b.onclick=()=>{ ui.view="day"; ui.day=DAYS.findIndex(d=>d.id===b.dataset.day); render(); window.scrollTo(0,$("#tabs").offsetTop) });
}

function statusFor(i){
  const d=DAYS[i];
  if(d.date<todayISO) return ["done","Done"];
  if(d.date===todayISO) return ["today","Today"];
  return ["", fmt(d,{weekday:"short"})];
}

function renderTabs(){
  const t=$("#tabs"); t.hidden = ui.view!=="day";
  t.innerHTML = DAYS.map((d,i)=>`<button class="tab ${d.kind==="ride"?"ride":""}" role="tab" id="tab-${d.id}" aria-selected="${i===ui.day}" data-i="${i}" aria-label="${esc(shortDate(d))}, ${esc(d.short)}">${fmt(d,{weekday:"short"})}<b>${dateOf(d).getDate()}</b>${(S["note_"+d.id]||"").trim()?'<span class="dot"></span>':""}</button>`).join("");
  t.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ ui.day=+b.dataset.i; ui.editSec=null; ui.prompt=null; ui.listEdit=null; render(); window.scrollTo(0,$("#tabs").offsetTop) });
}

function summary(){
  const p=progress(), L=[`${TRIP_NAME}`, `Progress: ${p.km} of ${TOTAL_KM} km, ${p.done} of ${MS.length} milestones`, ""];
  DAYS.forEach(d=>{
    const lines=[];
    d.flow.forEach(f=>{
      if(f.ms && S["ms_"+f.idx]) lines.push(`  ✓ ${f.ms} (${S["ms_time_"+f.idx]||""})`);
      if(f.sec) allStops(d,f).forEach(s=>{ if(S[stopId(d,f,s)]) lines.push(`  ✓ ${s.n}`) });
    });
    const note=(S["note_"+d.id]||"").trim();
    if(note) lines.push("  Notes: "+note.replace(/\n/g,"\n  "));
    if(lines.length) L.push(`${shortDate(d)} · ${d.title}`, ...lines, "");
  });
  return L.join("\n");
}
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); return true }catch(e){ return false } }

const nextDay = i => DAYS.find(d=>d.date>DAYS[i].date);
function chargeAlert(i){
  const n=nextDay(i);
  return n && n.kind==="ride" ? `<div class="alert charge"><b>Charge batteries tonight</b><span>Tomorrow is ${esc(n.title)}, ${esc(n.km.replace(/^About/,"about"))}.</span></div>` : "";
}
function contactRow(c){ return `<div class="contact"><div><b>${esc(c.name)}</b><small>${esc(c.detail)}</small>${c.num?`<span class="num">${esc(c.num)}</span>`:""}</div>${c.num?`<button class="copy" data-n="${esc(c.num)}">Copy</button>`:""}</div>` }
function bookingsHTML(){
  const rows=[];
  DAYS.forEach(d=>d.flow.forEach(f=>f.sec&&f.stops.forEach(s=>{ if(s.book) rows.push({d,s,meal:f.sec.split(" · ")[0]}) })));
  return fold("bookings","Bookings",`${rows.map(({d,s,meal})=>`<div class="contact"><div><b>${esc(s.n)}</b><small>${shortDate(d)} · ${esc(meal)}</small><span class="bk ${s.booked?"yes":""}">${s.booked?"Booked: "+esc(s.booked):"Not booked yet"}</span>${s.phone?`<span class="num">${esc(s.phone)}</span>`:""}</div>${s.phone?`<button class="copy" data-n="${esc(s.phone)}">Copy</button>`:""}</div>`).join("")}`);
}

function stopHTML(d,f,s,editing){
  const id=stopId(d,f,s), on=!!S[id], hid=!!S["hid_"+id];
  if(hid && !editing) return "";
  return `<div class="stop-row ${hid?"hid":""}">
    <button class="stop ${on?"on":""}" data-id="${id}" aria-pressed="${on}"><span class="c"></span><span>
      <span class="nm">${esc(s.n)}</span>${s.tag?`<span class="tag">${esc(s.tag)}</span>`:""}${s.book?`<span class="tag book">${s.booked?"Booked":"Book ahead"}</span>`:""}
      ${s.d?`<span class="ds">${esc(s.d)}</span>`:""}${s.loc?`<span class="lc">${esc(s.loc)}</span>`:""}
    </span></button>
    ${editing&&s.own?`<button class="hide-btn" data-own-rm="${esc(secId(d,f))}|${esc(s.n)}">Remove</button>`:editing&&!on?`<button class="hide-btn ${hid?"restore":""}" data-hide="${id}">${hid?"Show":"Hide"}</button>`:""}
  </div>${s.phone&&!hid?`<div class="phone"><span>${esc(s.phone)}</span><button class="copy" data-n="${esc(s.phone)}">Copy</button></div>`:""}`;
}

  ${sur?surpriseHTML(sur):""}
  <section class="card"><details class="pack head" data-dfold="head" ${sget("dfold_head_"+d.id,true)?"open":""}>
    <summary><span class="head-sum"><span class="meta">${ride?`Ride day ${d.n} · `:(d.kind==="pre"?"Pre-trip · ":"Post-trip · ")}${fmt(d,{weekday:"long",day:"numeric",month:"long"})}</span>
    <h2>${esc(d.title)}</h2><span class="when-closed notes">${ride?d.km+" · ":""}Tap to show the overview</span></span></summary>
    <div class="pack-body">
    <p>${esc(d.intro)}</p>
    ${ride?`<div class="stats">
      <div class="stat"><b>${d.km}</b><span>distance</span></div>
      <div class="stat t"><b>${esc(d.grade)}</b><span>grade</span></div>
      <div class="stat t"><b>${esc(d.climb)}</b><span>elevation</span></div>
      <div class="stat t"><b>${esc(d.surface)}</b><span>surface</span></div>
    </div><p class="terrain">${esc(d.terrain)}</p>`:""}
    ${(d.alerts||[]).map(a=>`<div class="alert"><b>${esc(a.t)}</b><span>${esc(a.d)}</span></div>`).join("")}
    ${chargeAlert(ui.day)}
    ${d.water?`<div class="water"><b>Toilets and water</b><span>${esc(d.water)}</span></div>`:""}
    <div class="btns">
      <a class="btn${d.finish?"":" wide"}" href="${mapUrl(d.start[1])}" target="_blank" rel="noopener">${d.finish?"Start: ":""}${esc(d.start[0])}</a>
      ${d.finish?`<a class="btn" href="${mapUrl(d.finish[1])}" target="_blank" rel="noopener">Finish: ${esc(d.finish[0])}</a>`:""}
      ${d.extraMap?`<a class="btn alt wide" href="${mapUrl(d.extraMap[1])}" target="_blank" rel="noopener">${esc(d.extraMap[0])}</a>`:""}
    </div>
    </div></details>
  </section>
  ${listHTML("pack",d)}
  ${nextDay(ui.day)&&nextDay(ui.day).kind==="ride"?listHTML("eod",d):""}
  ${d.flow.some(f=>f.sec)?`<div class="row-end"><span class="meta">${ride?"The day, stop by stop":"Details"}</span><button class="link" id="toggle-all">${anyOpen?"Collapse all":"Expand all"}</button></div>`:""}
  <div class="flow">${flow}</div>
  <section class="card">
    <label for="note-${d.id}"><h3>Notes</h3></label>
    <textarea id="note-${d.id}" placeholder="To-do, reminders, journal">${esc(S["note_"+d.id]||"")}</textarea>
    <span class="saved" id="saved">Saved</span>
  </section>
  ${ui.day===DAYS.length-1?`<section class="card"><details class="pack"><summary><h3>Want to keep your notes from the trip?</h3></summary><div class="pack-body">
    <p>Your ticks and notes are saved in this guide on this phone. To keep a copy of your own:</p>
    <ol class="steps"><li>Tap <b>Copy my trip notes</b> below. It copies every day's ticks, times and notes.</li><li>Open the Notes app, or start an email to yourself.</li><li>Press and hold in the empty note, then tap <b>Paste</b>.</li></ol>
    <div class="btns"><button class="btn wide" id="save-last">Copy my trip notes</button></div>
  </div></details></section>`:""}`;
}

function keep(fn){ const y=window.scrollY; fn(); render(); window.scrollTo(0,y) }

function render(){
  sset("view",ui.view);
  document.querySelectorAll(".nav button").forEach(b=>{ if(b.dataset.view===ui.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current") });
  renderSpine(); renderTabs();
  const v=$("#view");
  v.innerHTML = ui.view==="trip" ? tripView() : dayView();
  bindVoice(v);
  if($("#save-last")) $("#save-last").onclick=async()=>{ toast(await copyText(summary()) ? "Copied. Now paste it into Notes" : "Couldn't copy on this phone") };
  v.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{ b.textContent = await copyText(b.dataset.n) ? "Copied" : b.dataset.n });

  if(ui.view==="trip"){
    v.querySelectorAll("details[data-fold]").forEach(x=>x.ontoggle=()=>sset("fold_"+x.dataset.fold,x.open));
    $("#open-focus").onclick=()=>{ ui.view="day"; ui.day=focusIdx; render(); window.scrollTo(0,0) };
    v.querySelectorAll(".day-row").forEach(r=>r.onclick=()=>{ ui.view="day"; ui.day=+r.dataset.i; render(); window.scrollTo(0,0) });
    $("#save").onclick=async()=>{ toast(await copyText(summary()) ? "Summary copied" : "Couldn't copy on this phone") };
    $("#show-hidden").onclick=()=>keep(()=>{ Object.keys(S).filter(k=>k.startsWith("hid_")).forEach(k=>delete S[k]); save(); toast("Hidden options are back") });
    if($("#reset")) $("#reset").onclick=()=>keep(()=>ui.resetAsk=true);
    if($("#reset-no")) $("#reset-no").onclick=()=>keep(()=>ui.resetAsk=false);
    if($("#reset-yes")) $("#reset-yes").onclick=async()=>{ await copyText(summary()); const view=S.view; S={view}; save(); ui.resetAsk=false; render(); toast("Cleared. Summary copied first") };
    return;
  }

  const d=DAYS[ui.day];
  v.querySelectorAll(".ms").forEach(b=>b.onclick=()=>keep(()=>{
    const i=b.dataset.ms;
    if(S["ms_"+i]){ delete S["ms_"+i]; delete S["ms_time_"+i] }
    else { S["ms_"+i]=true; S["ms_time_"+i]=new Date().toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"}) }
    save(); if(navigator.vibrate) navigator.vibrate(40);
  }));
  v.querySelectorAll(".stop").forEach(b=>b.onclick=()=>keep(()=>{
    const id=b.dataset.id; sset(id,!S[id]);
    ui.prompt=null;
    if(S[id] && ui.editSec===null){
      const f=d.flow.find(f=>f.sec&&allStops(d,f).some(s=>stopId(d,f,s)===id));
      if(f&&allStops(d,f).some(s=>{const o=stopId(d,f,s);return o!==id&&!S[o]&&!S["hid_"+o]})) ui.prompt=secId(d,f);
    }
  }));
  v.querySelectorAll("[data-pyes]").forEach(b=>b.onclick=()=>keep(()=>{ const f=d.flow[+b.dataset.pyes]; allStops(d,f).forEach(s=>{const o=stopId(d,f,s); if(!S[o]) S["hid_"+o]=true}); save(); ui.prompt=null }));
  v.querySelectorAll("[data-pno]").forEach(b=>b.onclick=()=>keep(()=>ui.prompt=null));
  v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>keep(()=>{ ui.prompt=null; ui.editSec = ui.editSec===b.dataset.edit?null:b.dataset.edit }));
  v.querySelectorAll("form[data-own-add]").forEach(fm=>fm.onsubmit=e=>{ e.preventDefault(); const k="own_"+fm.dataset.ownAdd, t=fm.querySelector("input").value.trim(); if(!t) return; keep(()=>{ const l=(S[k]||[]).filter(x=>x!==t); l.push(t); sset(k,l) }) });
  v.querySelectorAll("[data-own-rm]").forEach(b=>b.onclick=()=>keep(()=>{ const [sid,n]=b.dataset.ownRm.split("|"), k="own_"+sid; sset(k,(S[k]||[]).filter(x=>x!==n)) }));
  v.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>keep(()=>sset("hid_"+b.dataset.hide,!S["hid_"+b.dataset.hide])));
  v.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>keep(()=>sset(b.dataset.col,!S[b.dataset.col])));
  if($("#finished")) $("#finished").onclick=()=>{ fx("emoji"); showPop(FINALE.title,FINALE.text,FINALE.button,()=>{ if(!S.finale){ S.finale=stamp(); save() } stopFx(); ui.view="trip"; render(); window.scrollTo(0,0) }) };
  if($("#toggle-all")) $("#toggle-all").onclick=()=>keep(()=>{ const anyOpen=d.flow.some(f=>f.sec&&!S[secId(d,f)]); d.flow.forEach(f=>{ if(f.sec){ if(anyOpen) S[secId(d,f)]=true; else delete S[secId(d,f)] } }); save() });

  // Packing
  v.querySelectorAll("details[data-dfold]").forEach(x=>x.ontoggle=()=>sset("dfold_"+x.dataset.dfold+"_"+d.id,x.open?undefined:false));
  v.querySelectorAll("details.pack[data-list]").forEach(x=>x.ontoggle=()=>sset(x.dataset.list+"open_"+d.id,x.open));
  v.querySelectorAll("details.sub").forEach(x=>x.ontoggle=()=>sset(x.dataset.list+"sub_"+d.id+"_"+x.dataset.gi,x.open));
  v.querySelectorAll(".check input").forEach(x=>x.onchange=()=>keep(()=>{ const k=x.dataset.list+"_"+d.id, t=sget(k,[]).filter(i=>i!==x.dataset.k); if(x.checked) t.push(x.dataset.k); sset(k,t.length?t:undefined) }));
  v.querySelectorAll("[data-ledit]").forEach(b=>b.onclick=()=>keep(()=>{ const [key,gi]=b.dataset.ledit.split("|"); ui.listEdit={key,gi:+gi} }));
  v.querySelectorAll("[data-ldone]").forEach(b=>b.onclick=()=>keep(()=>{ ui.listEdit=null; ui.gdel=null }));
  // Move ticks on every day when a section or item is renamed
  const moveTicks=(key,fn)=>DAYS.forEach(x=>{ const t=sget(key+"_"+x.id,null); if(t) sset(key+"_"+x.id,t.map(fn)) });
  v.querySelectorAll("[data-ren]").forEach(x=>x.onchange=()=>keep(()=>{ const [key,gi]=x.dataset.ren.split("|"), l=listItems(key), g=l[+gi], n=x.value.trim();
    if(!n||n===g.name||l.some(o=>o.name===n)) return; const o=g.name; g.name=n; sset(key+"_list",l); moveTicks(key,k=>k.startsWith(o+"|")?n+k.slice(o.length):k) }));
  v.querySelectorAll("[data-ied]").forEach(x=>x.onchange=()=>keep(()=>{ const [key,gi,j]=x.dataset.ied.split("|"), l=listItems(key), g=l[+gi], n=x.value.trim(), o=g.items[+j];
    if(!n||n===o||g.items.includes(n)) return; g.items[+j]=n; sset(key+"_list",l); moveTicks(key,k=>k===g.name+"|"+o?g.name+"|"+n:k) }));
  v.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>keep(()=>{ const id=b.dataset.gdel; if(ui.gdel!==id){ ui.gdel=id; return }
    const [key,gi]=id.split("|"), l=listItems(key); l.splice(+gi,1); sset(key+"_list",l); ui.gdel=null; ui.listEdit=null; toast("Section removed") }));
  v.querySelectorAll("form[data-gadd]").forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const key=f.dataset.gadd, n=f.querySelector("input").value.trim(); if(!n) return;
    keep(()=>{ const l=listItems(key); if(l.some(o=>o.name===n)){ toast("There's already a section called that"); return } l.push({name:n,items:[]}); sset(key+"_list",l); ui.listEdit={key,gi:l.length-1}; sset(key+"sub_"+d.id+"_"+(l.length-1),true) }); const a=$("#add-"+key+"-"+(listItems(key).length-1)); if(a) a.focus() });
  v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>keep(()=>{ const [key,gi,j]=b.dataset.rm.split("|"); const l=listItems(key); l[+gi].items.splice(+j,1); sset(key+"_list",l) }));
  v.querySelectorAll("form[data-add]").forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const [key,gi]=f.dataset.add.split("|"), inp=f.querySelector("input"), t=inp.value.trim(); if(!t) return;
    keep(()=>{ const l=listItems(key); if(!l[+gi].items.includes(t)) l[+gi].items.push(t); sset(key+"_list",l) }); const n=$("#add-"+key+"-"+gi); if(n) n.focus() });
  v.querySelectorAll("[data-lrestore]").forEach(b=>b.onclick=()=>keep(()=>{ delete S[b.dataset.lrestore+"_list"]; save(); ui.listEdit=null; toast("Back to the original list") }));
  v.querySelectorAll("[data-luntick]").forEach(b=>b.onclick=()=>keep(()=>sset(b.dataset.luntick+"_"+d.id,undefined)));

  // Notes autosave
  const ta=$("#note-"+d.id);
  ta.oninput=()=>{ clearTimeout(ta.t); ta.t=setTimeout(()=>{ sset("note_"+d.id,ta.value.trim()?ta.value:undefined); const s=$("#saved"); s.classList.add("show"); setTimeout(()=>s.classList.remove("show"),1200); renderTabs() },600) };

  const tab=$("#tab-"+d.id); if(tab) tab.scrollIntoView({inline:"center",block:"nearest"});
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{ ui.view=b.dataset.view; ui.resetAsk=false; render(); window.scrollTo(0,0) });

/* ===== Secret extras: wisdom pop-ups, the finale and celebrations ===== */
// Voice notes on a surprise card
const PLAY='<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>', PAUSE='<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
const voiceHTML = sur => sur.voice ? `<div class="voice">${sur.voice.map(n=>`<div class="vn" data-src="${esc(n.src)}"><button class="play" type="button" aria-label="Play message ${esc(n.who)}">${PLAY}</button><div style="flex:1;min-width:0"><b>${esc(n.who)}</b><small class="len">${esc(n.len||"")}</small><div class="bar"><i></i></div></div></div>`).join("")}</div>` : "";
let vnNow=null;
function bindVoice(root){
  if(vnNow){ vnNow.pause(); vnNow=null }
  const all=[...root.querySelectorAll(".vn")];
  all.forEach(vn=>{ const b=vn.querySelector(".play"), fill=vn.querySelector(".bar i"), a=new Audio(vn.dataset.src); a.preload="metadata";
    a.ontimeupdate=()=>{ if(a.duration) fill.style.width=(a.currentTime/a.duration*100)+"%" };
    a.onended=()=>{ b.innerHTML=PLAY; fill.style.width="0"; vnNow=null };
    b.onclick=()=>{ const was=vnNow===a; if(vnNow){ vnNow.pause() } all.forEach(x=>x.querySelector(".play").innerHTML=PLAY); vnNow=null; if(was) return;
      vnNow=a; b.innerHTML=PAUSE; a.play().catch(()=>{ b.innerHTML=PLAY; vnNow=null; vn.querySelector(".len").textContent="Couldn't play. Check you have signal." }) } });
}
// Birthday card: sealed on its day until tapped, then opens with confetti. Stays on the page to open again.
const NOTE_IC={audio:PLAY, video:'<svg viewBox="0 0 24 24"><path d="M3 6h12a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zm14 4 5-3v10l-5-3z"/></svg>'};
const surpriseHTML = sur => sur.card
  ? `<button class="envelope" type="button" data-card="1"><span class="seal">${esc(sur.seal)}</span><b>${esc(sur.title)}</b><span>${esc(sur.hint)}</span></button>`
  : `<section class="card surprise${sur.center?" center":""}"><h2>${esc(sur.title)}</h2><p>${esc(sur.text)}</p>${voiceHTML(sur)}</section>`;
let bcAudio=null, bcSur=null;
function bcStop(){ if(!bcAudio) return; bcAudio.a.pause(); bcAudio.b.querySelector(".ic").innerHTML=PLAY; bcAudio=null }
function openCard(sur){
  bcSur=sur; if(vnNow){ vnNow.pause(); vnNow=null }
  $("#bc-h").textContent=sur.head; $("#bc-msg").textContent=sur.text;
  $("#bc-notes").innerHTML=sur.notes.map((n,i)=>`<li><button class="bnote k-${n.kid||""}" type="button" data-n="${i}"><span class="ic">${NOTE_IC[n.kind]}</span><span class="tx"><b>${esc(n.who)}</b><small>${esc(n.len)}</small>${n.sub?`<small class="bsub">${esc(n.sub)}</small>`:""}${n.kind==="audio"?'<span class="prog"><i></i></span>':""}</span>${n.em?`<span class="kem" aria-hidden="true">${n.em}</span>`:""}</button></li>`).join("");
  const ov=$("#bov"); ov.hidden=true; void ov.offsetWidth; ov.hidden=false; ov.scrollTop=0; setTimeout(()=>fx("confetti"),250);
}
document.addEventListener("click",e=>{ const env=e.target.closest(".envelope[data-card]"); if(env){ const sur=SURPRISES[todayISO]||DAYS.map(d=>SURPRISES[d.date]).find(x=>x&&x.card); if(sur) openCard(sur) } });
$("#bc-notes").addEventListener("click",e=>{
  const b=e.target.closest(".bnote"); if(!b) return; const n=bcSur.notes[b.dataset.n];
  if(n.kind==="video"){ bcStop(); $("#vv-t").textContent=n.who; const v=$("#vv-v"); v.src=n.src; $("#vv").hidden=false; v.play().catch(()=>{}); return }
  if(bcAudio&&bcAudio.b===b){ const a=bcAudio.a; if(a.paused){ a.play(); b.querySelector(".ic").innerHTML=PAUSE } else { a.pause(); b.querySelector(".ic").innerHTML=PLAY } return }
  bcStop(); const a=new Audio(n.src), bar=b.querySelector(".prog i"); bcAudio={a,b};
  a.ontimeupdate=()=>{ if(a.duration) bar.style.width=(a.currentTime/a.duration*100)+"%" };
  a.onended=()=>{ b.querySelector(".ic").innerHTML=PLAY; bar.style.width="0"; bcAudio=null };
  b.querySelector(".ic").innerHTML=PAUSE; a.play().catch(()=>{ b.querySelector(".ic").innerHTML=PLAY; b.querySelector("small").textContent="Couldn't play. Check you have signal."; bcAudio=null });
});
$("#vv-close").onclick=()=>{ const v=$("#vv-v"); v.pause(); v.removeAttribute("src"); v.load(); $("#vv").hidden=true };
$("#bc-close").onclick=()=>{ bcStop(); stopFx(); $("#bov").hidden=true };
function stamp(){ const n=new Date(); return {ts:n.getTime(), t:n.toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})} }
function rulesHTML(){ return S.rules ? fold("rules",RULES.title,rulesList(),false,true) : "" }
if(S.finale && todayISO<DAYS.filter(x=>x.kind==="ride").pop().date){ delete S.finale; save() }
function wisdomHTML(){
  const got=WISDOM.map((w,i)=>({w,s:S["wq_"+i]})).filter(x=>x.s);
  if(S.finale) got.push({w:{text:FINALE.text},s:S.finale});
  if(!got.length) return "";
  got.sort((a,b)=>b.s.ts-a.s.ts);
  return fold("wisdom","Words of Questionable Wisdom ✨",`
    ${got.map(x=>`<div class="wq"><span class="meta">${esc(x.s.t)}</span><span class="q">${esc(x.w.text)}</span></div>`).join("")}`,false,true);
}
const rulesList=()=>`<ol class="rules">${RULES.items.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>`;
function showPop(title,text,btn,done,html){
  $("#wpop-t").textContent=title; if(html) $("#wpop-q").innerHTML=html; else $("#wpop-q").textContent=text; $("#wpop-q").className=html?"":"q"; $("#wpop-ok").innerHTML=btn;
  $("#wpop").hidden=false; $("#wpop-ok").focus();
  $("#wpop-ok").onclick=()=>{ $("#wpop").hidden=true; done() };
}
const wTime=w=>new Date(w.date+"T"+w.at+":00");
// Only the newest due saying pops up. Any older ones missed while the guide was closed go quietly into the Trip page section.
function wisdomDue(){ const now=Date.now(), due=WISDOM.map((w,i)=>i).filter(i=>!S["wq_"+i]&&wTime(WISDOM[i]).getTime()<=now); if(!due.length) return -1;
  const last=due.pop(); if(due.length){ due.forEach(i=>{ const t=wTime(WISDOM[i]); S["wq_"+i]={ts:t.getTime(), t:t.toLocaleString("en-AU",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})} }); save(); if(ui.view==="trip") keep(()=>{}) } return last }
function checkWisdom(){
  if(!$("#wpop").hidden) return;
  const i=wisdomDue();
  if(i<0){ if(!S.rules&&wTime(RULES).getTime()<=Date.now()) showPop(RULES.label,"","Noted",()=>{ S.rules=stamp(); save(); if(ui.view==="trip") keep(()=>{}) },`<h2>${esc(RULES.title)}</h2>${rulesList()}`); return }
  showPop("Words of Questionable Wisdom ✨",WISDOM[i].text,"Noted",()=>{ S["wq_"+i]=stamp(); save(); if(ui.view==="trip") keep(()=>{}); setTimeout(checkWisdom,600) });
}
function storeCheck(){ let ok=false; try{ localStorage.setItem("m2m_probe","1"); ok=localStorage.getItem("m2m_probe")==="1"; localStorage.removeItem("m2m_probe") }catch(e){}
  const n=WISDOM.filter((w,i)=>S["wq_"+i]).length;
  return ok ? `Saving on this phone is working. Sayings cleared so far: ${n} of ${WISDOM.length}.` : "This phone isn't letting the guide save anything, so ticks and sayings will reset each time it opens." }
// Celebrations drawn on one full-screen canvas
let fxRun=0;
function stopFx(){ cancelAnimationFrame(fxRun); const c=$("#fx"); c.hidden=true }
function fx(kind){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  stopFx(); const c=$("#fx"); c.hidden=false;
  const W=innerWidth,H=innerHeight,d=devicePixelRatio||1; c.width=W*d; c.height=H*d; const g=c.getContext("2d"); g.setTransform(d,0,0,d,0,0);
  const R=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
  let P, step, dur;
  if(kind==="confetti"){ const cols=["#D2A23A","#2F6F73","#E06C9F","#8E6CC7","#C0563B","#6DB5B5"];
    P=Array.from({length:Math.round(W/2.2)},()=>({x:R(0,W),y:R(-H*.8,-20),w:R(6,11),h:R(9,15),vy:R(2.5,5.5),vx:R(-1.5,1.5),a:R(0,6),va:R(-.2,.2),c:pick(cols)}));
    step=()=>P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle=p.c; g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore() }); dur=4500 }
  else { const set=["🚲","🏁","🏆","🎉","🍷","🍺"];
    P=Array.from({length:Math.round(W/7)},()=>({x:R(0,W),y:R(-H,-30),s:R(26,40),vy:R(2,4),ph:R(0,6),a:R(-.3,.3),e:pick(set)}));
    step=t=>P.forEach(e=>{ e.y+=e.vy; g.save(); g.translate(e.x+Math.sin(t/500+e.ph)*9,e.y); g.rotate(e.a); g.font=e.s+"px system-ui,'Apple Color Emoji','Segoe UI Emoji'"; g.textAlign="center"; g.fillText(e.e,0,0); g.restore() }); dur=6500 }
  const t0=performance.now();
  const f=t=>{ g.clearRect(0,0,W,H); step(t-t0); if(t-t0<dur) fxRun=requestAnimationFrame(f); else stopFx() };
  fxRun=requestAnimationFrame(f);
}

render();
// Birthday: confetti the first time the guide is opened that day on this phone
const bday=SURPRISES[todayISO];
if(bday&&bday.confetti&&!S["cele_"+todayISO]){ sset("cele_"+todayISO,true); setTimeout(()=>fx("confetti"),400) }
setTimeout(checkWisdom, bday&&bday.confetti ? 3500 : 600);
setInterval(checkWisdom,60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkWisdom() });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
